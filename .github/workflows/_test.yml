name: Reusable Test Workflow

on:
  workflow_call:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate test matrix
        id: set-matrix
        run: |
          # Parse test-matrix.json and generate GitHub Actions matrix
          MATRIX=$(cat tests/matrix.json | jq -c '[
            to_entries[] | 
            .value as $versions | 
            .key as $package | 
            $versions | to_entries[] | 
            {
              package: $package,
              magento_version: .key,
              php_version: .value
            }
          ]')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  test:
    needs: generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    name: Test ${{ matrix.package }}:${{ matrix.magento_version }}-${{ matrix.php_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Retried only when the failure names a network problem. A blanket retry
      # would run a genuinely flaky patch three times and report the run that
      # happened to pass, which is the same blindness `patch:list || true` gave
      # us. A patch that does not apply fails once, immediately.
      - name: Run test for ${{ matrix.magento_version }}
        run: |
          CONTAINER_IMAGE="${{ matrix.package }}:${{ matrix.magento_version }}-${{ matrix.php_version }}"

          for attempt in 1 2 3; do
            set +e
            OUTPUT=$(docker run --rm \
              --name "m2-meta-security-patches-test-${{ matrix.magento_version }}-${{ matrix.php_version }}-${attempt}" \
              -v "$(pwd)/:/var/www/html/extensions/m2-meta-security-patches:ro" \
              $CONTAINER_IMAGE \
              sh -c "composer config --json extra.magento-patches.trust '[\"samjuk/*\"]' \
                && composer config --no-plugins allow-plugins.samjuk/magento-patch-installer true \
                && composer require samjuk/m2-meta-security-patches:@dev --no-interaction -W \
                && composer patches:status -v \
                && composer patches:verify" 2>&1)
            STATUS=$?
            set -e

            echo "$OUTPUT"
            [ $STATUS -eq 0 ] && exit 0

            if ! echo "$OUTPUT" | grep -qiE 'curl error|connection timed out|could not resolve|network is unreachable|failed to (download|open stream)|50[0234] (Bad Gateway|Service Unavailable|Gateway Time)|temporary failure in name resolution'; then
              echo "::error::Failed for a reason that is not transient — not retrying"
              exit $STATUS
            fi

            echo "::warning::Attempt ${attempt} hit a network error, retrying"
            sleep $((attempt * 15))
          done

          echo "::error::Still failing on a network error after 3 attempts"
          exit 1

      - name: Output result
        if: success()
        run: echo "✅ Test succeeded for ${{ matrix.magento_version }} (${{ matrix.php_version }})"

  test-summary:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi
