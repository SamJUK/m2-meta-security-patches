name: Test on Master

on:
  push:
    branches:
      - master
      - main
    # A changelog bump or README edit changes nothing that installs. A push that
    # also touches anything else still runs.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.claude/**'

jobs:
  run-tests:
    uses: ./.github/workflows/_test.yml
