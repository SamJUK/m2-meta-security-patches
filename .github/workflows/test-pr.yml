name: Test PR

# Every pull request. It used to wait for a `run-tests` label, so a pull request
# nobody labelled (Dependabot's, for one) was never tested, and the job meant to
# take the label off again had no permission to. Re-run from the Actions tab.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/workflows/post-release.yml'
      - 'docs/**'
      - 'LICENSE'
      - '.claude/**'
      - '.github/dependabot.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    uses: ./.github/workflows/_test.yml
