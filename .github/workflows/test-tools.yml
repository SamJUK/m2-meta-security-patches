name: Test maintainer tools

# The patch-day scripts, offline against fixtures. Seconds, so no label needed.

on:
  push:
    branches: [master]
    paths: ['bin/**', 'tests/test_*.py', '.github/workflows/test-tools.yml']
  pull_request:
    paths: ['bin/**', 'tests/test_*.py', '.github/workflows/test-tools.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test the ingest script
        run: python3 -I -m unittest discover -s tests -p 'test_*.py' -v
